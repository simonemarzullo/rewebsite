name: fub-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fub_probe.py
        env:
          FUB_API_KEY: ${{ secrets.FUB_API_KEY }}
          FUB_SYSTEM: ${{ secrets.FUB_SYSTEM }}
          FUB_SYSTEM_KEY: ${{ secrets.FUB_SYSTEM_KEY }}
